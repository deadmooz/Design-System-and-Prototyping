<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS Studio</title>
<meta name="description" content="Extract a design system from a website or Figma file and prototype with it using any LLM.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='4' fill='%23fff' opacity='.7'/%3E%3Crect x='7' y='17' width='18' height='8' rx='2' fill='%23fff' opacity='.45'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#import" aria-label="DS Studio home">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><rect x="7" y="7" width="8" height="8" rx="2" fill="#fff"/><rect x="17" y="7" width="8" height="8" rx="4" fill="#fff" opacity=".7"/><rect x="7" y="17" width="18" height="8" rx="2" fill="#fff" opacity=".45"/></svg>
    <span>DS Studio</span>
  </a>
  <span id="ds-name" class="ds-name"></span>
  <div class="topbar-actions">
    <label class="sr-only" for="provider">AI provider</label>
    <select id="provider" class="input input--sm"></select>
    <label class="sr-only" for="model">Model</label>
    <input id="model" class="input input--sm model" autocomplete="off" spellcheck="false">
    <details class="menu">
      <summary class="btn btn--sm">Project</summary>
      <div class="menu-pop">
        <button id="export-project" class="btn btn--sm">Export project</button>
        <label class="btn btn--sm">Import project<input id="import-project" type="file" accept=".json,application/json" hidden></label>
        <button id="reset-project" class="btn btn--sm btn--danger">Reset</button>
      </div>
    </details>
  </div>
</header>
<div class="shell">
  <nav id="nav" class="sidenav" aria-label="Workspace"></nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
